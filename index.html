<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Intervale Acres</title>
<meta name="description" content="A farm-and-market game: plant, harvest, bake, fill orders. Set on the Winooski floodplain in Burlington, Vermont.">
<meta name="theme-color" content="#F6EBD3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Intervale Acres">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,800;9..144,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script data-goatcounter="https://btown-brief.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="hCoins" class="pill" aria-label="Coins"><i class="i-coin"></i><b id="coinN">0</b></button>
    <button id="hLevel" class="lvl" aria-label="Level"><span id="lvlN">1</span><i class="bar"><i id="xpFill"></i></i></button>
    <button id="hHearts" class="pill" aria-label="Hearts"><svg class="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.1 1.8-1.9 3.3-3.1 5.4-3.1C21 4.5 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z"/></svg><b id="heartN">0</b></button>
    <button id="hCellar" class="pill" aria-label="Root cellar"><svg class="i-crate" viewBox="0 0 24 24"><path d="M3 8l9-4 9 4v10l-9 4-9-4z"/><path class="ln" d="M3 8l9 4 9-4M12 12v10"/></svg><b id="cellarN">0/40</b></button>
    <button id="hGear" class="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  </header>
  <button id="strip" aria-label="Goal"></button>
  <main id="stage"><canvas id="scene" aria-label="Farm"></canvas></main>
  <nav id="nav">
    <button data-place="field" class="on"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 19c0-4 2-7 6-8M12 11c0-3 2-5 5-6-0 3-2 5-5 6zM12 11C12 8 10 6 7 5c0 3 2 5 5 6z"/></svg><span>Field</span><em></em></button>
    <button data-place="barn"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z"/><path d="M9 20v-6h6v6M9 14l6 6M15 14l-6 6"/></svg><span>Barn</span><em></em></button>
    <button data-place="market"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5M3 9h18M3 9c0 2 1.5 3 3 3s3-1 3-3c0 2 1.5 3 3 3s3-1 3-3c0 2 1.5 3 3 3s3-1 3-3M5 12v8h14v-8"/></svg><span>Market</span><em></em></button>
  </nav>
  <canvas id="fx"></canvas>
  <div id="grain"></div>
  <div id="sheetWrap" class="hidden"><div id="sheetBg"></div><section id="sheet"></section></div>
  <div id="banner" class="hidden"></div>
  <div id="toast"></div>
  <div id="act" class="hidden" role="group" aria-label="Quick action"></div>
  <div id="title">
    <canvas id="titleArt"></canvas>
    <div class="logo">
      <svg class="crest" viewBox="0 0 120 52"><circle cx="60" cy="30" r="15" fill="#F2B233"/><path d="M8 40 Q 34 30 60 40 T 112 40" stroke="#2F7F8F" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M14 48 Q 38 40 60 48 T 106 48" stroke="#7FB8BC" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <div class="small">I N T E R V A L E</div>
      <div class="big">ACRES</div>
      <div id="ribbon" class="hidden">Harvest Festival</div>
    </div>
    <p class="tag">A farm-and-market game: plant, harvest, bake, fill orders.</p>
    <button id="playBtn">Play</button>
    <div id="today" aria-live="polite"></div>
    <div id="records"></div>
    <p class="foot">Burlington, Vermont · btown brief arcade</p>
  </div>
</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="market.js"></script>
<script src="game.js"></script>
</body>
</html>
